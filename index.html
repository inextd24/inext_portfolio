<style>
/* LOCAL FONT DECLARATION: BankGothic Md BT */
@font-face {
  font-family: 'BankGothic Md BT';
  src: url('BankGothicMdBT.woff2') format('woff2'),
       url('BankGothicMdBT.ttf') format('truetype');
  font-weight: 1000;
  font-style: normal;
  font-display: swap;
}

:root {
  --gold: #d4af37;
  --gold-glow: rgba(212, 175, 55, 0.35);
  --bg: #090909;
  --surface: #111111;
  --text: #ffffff;
  --muted: #aaa59b;
  --line: rgba(255, 255, 255, 0.11);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Poppins', sans-serif;
  -webkit-font-smoothing: antialiased;
}
body.lock { overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

/* CUSTOM SCROLLBAR */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold); }

/* HEADER */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 7%;
  transition: all 0.3s ease;
}
header.scrolled {
  background: rgba(8, 8, 8, 0.92);
  backdrop-filter: blur(15px);
  padding: 14px 7%;
  border-bottom: 1px solid var(--line);
}
.logo {
  font-family: 'BankGothic Md BT', 'Bank Gothic', 'Eurostile', 'Microgramma', sans-serif;
  font-size: 24px;
  font-weight: 500;
  letter-spacing: 6px;
  color: var(--gold);
  text-transform: uppercase;
}
nav { display: flex; gap: 28px; }
nav a {
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #bbb;
  transition: color 0.3s;
}
nav a:hover { color: var(--gold); }

/* HERO */
.hero {
  min-height: 100vh;
  position: relative;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
}
.hero-media, .hero-media:after { position: absolute; inset: 0; }
.hero-media img, .hero-media video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.65);
}
.hero-media:after {
  content: "";
  background: linear-gradient(to top, rgba(9, 9, 9, 0.98), rgba(0, 0, 0, 0.25) 55%, rgba(0, 0, 0, 0.5));
}
.hero-content {
  position: relative;
  z-index: 2;
  width: 86%;
  max-width: 1300px;
  margin: auto;
  padding-bottom: 11vh;
}
.eyebrow, .section-no, .category {
  font-size: 10px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--gold);
}
.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(48px, 7.5vw, 108px);
  font-weight: 500;
  line-height: 0.95;
  letter-spacing: -2px;
  margin: 18px 0;
}
.hero h1 span { color: var(--gold); }
.hero p {
  max-width: 580px;
  color: #d0cdc6;
  font-size: 14px;
  line-height: 1.8;
  font-weight: 300;
}
.actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 30px;
}
.btn {
  display: inline-flex;
  align-items: center;
  padding: 13px 26px;
  border: 1px solid var(--line);
  background: rgba(20, 20, 20, 0.65); /* Frosted glass background */
  backdrop-filter: blur(8px);
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s ease;
}
.btn.primary {
  background: var(--gold);
  border-color: var(--gold);
  color: #080808;
  font-weight: 500;
}
.btn:hover {
  transform: translateY(-2px);
  border-color: var(--gold);
}
.btn.primary:hover {
  box-shadow: 0 8px 22px var(--gold-glow);
}

/* SECTIONS */
.section { padding: 110px 7%; }
.dark { background: #0e0e0e; }
.head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 40px;
  margin-bottom: 44px;
}
.head h2 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(38px, 4.5vw, 64px);
  font-weight: 500;
  line-height: 1.05;
  margin: 12px 0 0;
}
.intro {
  max-width: 480px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
  font-weight: 300;
}

/* FILTERS */
.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 40px;
}
.filter {
  background: transparent;
  border: 1px solid var(--line);
  color: #999;
  padding: 9px 16px;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s ease;
}
.filter:hover, .filter.active {
  background: var(--gold);
  border-color: var(--gold);
  color: #080808;
  font-weight: 500;
}

/* GRID & CARDS */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}
.project { cursor: pointer; }
.project.hide { display: none; }
.card {
  position: relative;
  min-height: 400px;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 2px;
  isolation: isolate;
}
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  border: 1px solid transparent;
  transition: 0.45s ease;
  pointer-events: none;
}
.project:hover .card::before {
  border-color: rgba(212, 175, 55, 0.42);
}
.card img, .card video {
  width: 100%;
  height: 100%;
  min-height: 400px;
  object-fit: cover;
  display: block;
  transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1), filter 0.6s ease;
}
.card:after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.92) 5%, rgba(0, 0, 0, 0.2) 65%, transparent);
  pointer-events: none;
}
.project:hover .card img,
.project:hover .card video {
  transform: scale(1.045);
  filter: brightness(0.8);
}
.count {
  position: absolute;
  z-index: 2;
  right: 16px;
  top: 16px;
  padding: 6px 12px;
  border: 1px solid rgba(212, 175, 55, 0.7);
  border-radius: 20px;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(8px);
  color: var(--gold);
  font-size: 10px;
  letter-spacing: 1px;
}
.overlay {
  position: absolute;
  z-index: 2;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 80px 24px 24px;
}
.overlay h3 {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  font-weight: 500;
  margin: 6px 0 4px;
}
.meta {
  font-size: 11px;
  color: #aaa;
  display: flex;
  align-items: center;
  gap: 8px;
}
.meta::before {
  content: "";
  width: 16px;
  height: 1px;
  background: var(--gold);
  display: inline-block;
}
.arrow {
  margin-top: 12px;
  color: var(--gold);
  font-size: 11px;
  letter-spacing: 1px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: transform 0.3s;
}
.project:hover .arrow { transform: translateX(5px); }

.video-card::before {
  content: "▶";
  position: absolute;
  z-index: 3;
  top: 50%;
  left: 50%;
  width: 52px;
  height: 52px;
  margin: -26px 0 0 -26px
